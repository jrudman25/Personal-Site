<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#03003D" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <title>Page Not Found | Jordan Rudman</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Aptos, "Segoe UI", sans-serif;
      background: #03003D;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 184, 77, 0.14), transparent 28rem),
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        #03003D;
      background-size: auto, 72px 72px, 72px 72px, auto;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(255, 184, 77, 0.12), rgba(255, 255, 255, 0.05));
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
    }

    p:first-child {
      margin: 0 0 12px;
      color: #FFB84D;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    p {
      margin: 0 0 28px;
      color: rgba(255, 255, 255, 0.76);
      font-size: 1.08rem;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 10px 22px;
      border-radius: 999px;
      background: #FFB84D;
      color: #120C02;
      font-weight: 800;
      text-decoration: none;
    }

    a:hover {
      background: #FFD18A;
    }

    a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <p>404 error</p>
    <h1>This page wandered off.</h1>
    <p>The address may be incorrect, or the page may have moved. The portfolio is still right where you left it.</p>
    <a href="/">Return to the portfolio</a>
  </main>
</body>
</html>
